 are not optional.</text><path d="M80,236 H294.39 A16,16 0 0 1 310.39,252 V486 A16,16 0 0 1 294.39,502 H80 A16,16 0 0 1 64,486 V252 A16,16 0 0 1 80,236 Z" fill="#1d2552"/><path clip-path="url(#c135)" fill-rule="evenodd" fill="#2b3470" d="M60,232 H314.39 V506 H60 Z M80,237 H294.39 A15,15 0 0 1 309.39,252 V486 A15,15 0 0 1 294.39,501 H80 A15,15 0 0 1 65,486 V252 A15,15 0 0 1 80,237 Z"/><text x="92" y="293" font-family="Unbounded, &quot;Arial Black&quot;, sans-serif" font-size="32" font-weight="800" fill="#ff6b4d" xml:space="preserve">01</text><text x="92" y="333" font-family="Unbounded, &quot;Arial Black&quot;, sans-serif" font-size="19" font-weight="600" letter-spacing="-0.19" fill="#ffffff" xml:space="preserve">Written consent</text><text x="92" y="371" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a9b0d3" xml:space="preserve">From a parent or</text><text x="92" y="395" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a9b0d3" xml:space="preserve">guardian, plus the</text><text x="92" y="419" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a9b0d3" xml:space="preserve">school’s permission.</text><path d="M346.39,236 H560.8 A16,16 0 0 1 576.8,252 V486 A16,16 0 0 1 560.8,502 H346.39 A16,16 0 0 1 330.39,486 V252 A16,16 0 0 1 346.39,236 Z" fill="#1d2552"/><path clip-path="url(#c136)" fill-rule="evenodd" fill="#2b3470" d="M326.39,232 H580.8 V506 H326.39 Z M346.39,237 H560.8 A15,15 0 0 1 575.8,252 V486 A15,15 0 0 1 560.8,501 H346.39 A15,15 0 0 1 331.39,486 V252 A15,15 0 0 1 346.39,237 Z"/><text x="358.39" y="293" font-family="Unbounded, &quot;Arial Black&quot;, sans-serif" font-size="32" font-weight="800" fill="#ffc44b" xml:space="preserve">02</text><text x="358.39" y="333" font-family="Unbounded, &quot;Arial Black&quot;, sans-serif" font-size="19" font-weight="600" letter-spacing="-0.19" fill="#ffffff" xml:space="preserve">No identifying details</text><text x="358.39" y="371" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a9b0d3" xml:space="preserve">Never pair a child’s</text><text x="358.39" y="395" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a9b0d3" xml:space="preserve">photo with full name,</text><text x="358.39" y="419" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a9b0d3" xml:space="preserve">school, class or location.</text><path d="M612.8,236 H827.19 A16,16 0 0 1 843.19,252 V486 A16,16 0 0 1 827.19,502 H612.8 A16,16 0 0 1 596.8,486 V252 A16,16 0 0 1 612.8,236 Z" fill="#1d2552"/><path clip-path="url(#c137)" fill-rule="evenodd" fill="#2b3470" d="M592.8,232 H847.19 V506 H592.8 Z M612.8,237 H827.19 A15,15 0 0 1 842.19,252 V486 A15,15 0 0 1 827.19,501 H612.8 A15,15 0 0 1 597.8,486 V252 A15,15 0 0 1 612.8,237 Z"/><text x="624.8" y="293" font-family="Unbounded, &quot;Arial Black&quot;, sans-serif" font-size="32" font-weight="800" fill="#10c7a1" xml:space="preserve">03</text><text x="624.8" y="333" font-family="Unbounded, &quot;Arial Black&quot;, sans-serif" font-size="19" font-weight="600" letter-spacing="-0.19" fill="#ffffff" xml:space="preserve">Strip metadata</text><text x="624.8" y="371" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a9b0d3" xml:space="preserve">Remove location data</text><text x="624.8" y="395" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="15" font-weight="400" fill="#a9b0d3"