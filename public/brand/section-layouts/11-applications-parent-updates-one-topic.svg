akarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="19" font-weight="400" fill="#a9b0d3" xml:space="preserve">Begin with the source. Name the child and the class. Simple</text><text x="64" y="378" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="19" font-weight="400" fill="#a9b0d3" xml:space="preserve">English, no emoji, no marketing in operational messages.</text><text x="64" y="408" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="19" font-weight="400" fill="#a9b0d3" xml:space="preserve">Nothing between 9 pm and 7 am.</text><path d="M768,112 H1360 A16,16 0 0 1 1376,128 V222 A16,16 0 0 1 1360,238 H756 A4,4 0 0 1 752,234 V128 A16,16 0 0 1 768,112 Z" fill="#000" filter="url(#f219)"/><path d="M768,112 H1360 A16,16 0 0 1 1376,128 V222 A16,16 0 0 1 1360,238 H756 A4,4 0 0 1 752,234 V128 A16,16 0 0 1 768,112 Z" fill="#ffffff"/><text x="770" y="140" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#5b6474" xml:space="preserve">Game Up · Class 6B</text><text x="770" y="167" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#131a3d" xml:space="preserve">Good news: Meera completed 4 of 5 maths missions this week and</text><text x="770" y="191" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#131a3d" xml:space="preserve">earned the “Fraction Finder” badge. You could ask her to show you how</text><text x="770" y="215" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#131a3d" xml:space="preserve">she solved the last one.</text><path d="M768,252 H1360 A16,16 0 0 1 1376,268 V338 A16,16 0 0 1 1360,354 H756 A4,4 0 0 1 752,350 V268 A16,16 0 0 1 768,252 Z" fill="#000" filter="url(#f220)"/><path d="M768,252 H1360 A16,16 0 0 1 1376,268 V338 A16,16 0 0 1 1360,354 H756 A4,4 0 0 1 752,350 V268 A16,16 0 0 1 768,252 Z" fill="#ffffff"/><text x="770" y="280" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#5b6474" xml:space="preserve">Game Up · Reminder</text><text x="770" y="307" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#131a3d" xml:space="preserve">Parent–teacher meeting for Class 3A is on Saturday, 27 September, 10</text><text x="770" y="331" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#131a3d" xml:space="preserve">am. Reply 1 to confirm or 2 if you can’t make it.</text><path d="M768,368 H1360 A16,16 0 0 1 1376,384 V454 A16,16 0 0 1 1360,470 H756 A4,4 0 0 1 752,466 V384 A16,16 0 0 1 768,368 Z" fill="#000" filter="url(#f221)"/><path d="M768,368 H1360 A16,16 0 0 1 1376,384 V454 A16,16 0 0 1 1360,470 H756 A4,4 0 0 1 752,466 V384 A16,16 0 0 1 768,368 Z" fill="#ffffff"/><text x="770" y="396" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#5b6474" xml:space="preserve">Game Up · Class 4A</text><text x="770" y="423" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#131a3d" xml:space="preserve">Riya was absent today. If this is unexpected, please contact the school</text><text x="770" y="447" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#131a3d" xml:space="preserve">office.</text></svg>