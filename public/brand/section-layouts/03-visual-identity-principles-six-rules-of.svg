if" font-size="36" font-weight="800" fill="#ff6b4d" xml:space="preserve">01</text><text x="92" y="354" font-family="Unbounded, &quot;Arial Black&quot;, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.22" fill="#ffffff" xml:space="preserve">Always rising</text><text x="92" y="392" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#a9b0d3" xml:space="preserve">Motion goes up and to the right: streaks,</text><text x="92" y="418" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#a9b0d3" xml:space="preserve">arrows, crops that look upward.</text><path d="M524,252 H916 A16,16 0 0 1 932,268 V438 A16,16 0 0 1 916,454 H524 A16,16 0 0 1 508,438 V268 A16,16 0 0 1 524,252 Z" fill="#1d2552"/><path clip-path="url(#c81)" fill-rule="evenodd" fill="#2b3470" d="M504,248 H936 V458 H504 Z M524,253 H916 A15,15 0 0 1 931,268 V438 A15,15 0 0 1 916,453 H524 A15,15 0 0 1 509,438 V268 A15,15 0 0 1 524,253 Z"/><text x="536" y="312" font-family="Unbounded, &quot;Arial Black&quot;, sans-serif" font-size="36" font-weight="800" fill="#ffc44b" xml:space="preserve">02</text><text x="536" y="354" font-family="Unbounded, &quot;Arial Black&quot;, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.22" fill="#ffffff" xml:space="preserve">Night sky first</text><text x="536" y="392" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#a9b0d3" xml:space="preserve">When in doubt, start on Nebula. Go light only</text><text x="536" y="418" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#a9b0d3" xml:space="preserve">where people read or work.</text><path d="M968,252 H1360 A16,16 0 0 1 1376,268 V438 A16,16 0 0 1 1360,454 H968 A16,16 0 0 1 952,438 V268 A16,16 0 0 1 968,252 Z" fill="#1d2552"/><path clip-path="url(#c82)" fill-rule="evenodd" fill="#2b3470" d="M948,248 H1380 V458 H948 Z M968,253 H1360 A15,15 0 0 1 1375,268 V438 A15,15 0 0 1 1360,453 H968 A15,15 0 0 1 953,438 V268 A15,15 0 0 1 968,253 Z"/><text x="980" y="312" font-family="Unbounded, &quot;Arial Black&quot;, sans-serif" font-size="36" font-weight="800" fill="#10c7a1" xml:space="preserve">03</text><text x="980" y="354" font-family="Unbounded, &quot;Arial Black&quot;, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.22" fill="#ffffff" xml:space="preserve">Keep the streak special</text><text x="980" y="392" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#a9b0d3" xml:space="preserve">Hero moments only. If everything launches,</text><text x="980" y="418" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#a9b0d3" xml:space="preserve">nothing does.</text><path d="M80,474 H472 A16,16 0 0 1 488,490 V660 A16,16 0 0 1 472,676 H80 A16,16 0 0 1 64,660 V490 A16,16 0 0 1 80,474 Z" fill="#1d2552"/><path clip-path="url(#c83)" fill-rule="evenodd" fill="#2b3470" d="M60,470 H492 V680 H60 Z M80,475 H472 A15,15 0 0 1 487,490 V660 A15,15 0 0 1 472,675 H80 A15,15 0 0 1 65,660 V490 A15,15 0 0 1 80,475 Z"/><text x="92" y="534" font-family="Unbounded, &quot;Arial Black&quot;, sans-serif" font-size="36" font-weight="800" fill="#3b82f6" xml:space="preserve">04</text><text x="92" y="576" font-family="Unbounded, &quot;Arial Black&quot;, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.22" fill="#ffffff" xml:space="preserve">Colour with purpose</text><text x="92" y="614" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#a9b0d3" xml:space="preserve">Accents mark meaning: a module, an</text><text x="92" y="640" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#a9b0d3" xml:space="preserve">audience, a reward.</text><path d="M524,474 H916 A16,16 0 0 1 932,490 V660 A16,16 0 0 1 916,676 H524 A16,16 0 0 1 508,660 V490 A16,16 0 0 1 524,474 Z" fill="#1d2552"/><path clip-path="url(#c84)" fill-rule="evenodd" fill="#2b3470" d="M504,470 H936 V680 H504 Z M524,475 H916 A15,15 0 0 1 931,490 V660 A15,15 0 0 1 916,675 H524 A15,15 0 0 1 509,660 V490 A15,15 0 0 1 524,475 Z"/><text x="536" y="534" font-family="Unbounded, &quot;Arial Black&quot;, sans-serif" font-size="36" font-weight="800" fill="#a78bfa" xml:space="preserve">05</text><text x="536" y="576" font-family="Unbounded, &quot;Arial Black&quot;, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.22" fill="#ffffff" xml:space="preserve">People first</text><text x="536" y="614" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#a9b0d3" xml:space="preserve">A real face beats an illustration or a device</text><text x="536" y="640" font-family="&quot;Plus Jakarta Sans&quot;, -apple-system, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#a9b0d3" xml:space="preserve">mock-up.</text><path d="M968,474 H1360 A16,16 0 0 1 1376,490 V660 A16,16 0 0 1 1360,676 H968 A16,16 0 0 1 952,660 V490 A16,16 0 0 1 968,474 Z" fill="#1d2552"/><path clip-path="url(#c85)" fill-rule="evenodd" fill="#2b3470" d="M948,470 H1380 V680 H948 Z M968,475 H1360 A15,15 0 0 1 1375,490 V660 A15,15 0 0 1 1360,675 H968 A15,15 0 0 1 953,660 V490 A15,15 0 0 1 968,475 Z"/><text x="980" y="534" font-family="Unbounded, &quot;Arial Black&quot;, sans-serif" font-size="36" font-weight="800" fill="#ff6b4d" xml:space="preserve">06</text><text x="980" y="576" font-family="Unbounded, &quo